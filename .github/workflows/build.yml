name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, inside the 7-day cache eviction and 14-day artifact retention.
    - cron: "17 3 * * 1"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        with:
          cache-key: build-deps-ubuntu-22.04-x64
          packages: |
            build-essential
            curl
            file
            libayatana-appindicator3-dev
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            patchelf
            pkg-config
            wget
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # PRs restore main's caches; saving from every branch overflows the
          # repo's 10 GB and evicts main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version consistency
        run: pnpm verify:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  platform-build:
    name: Compile (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runner and target on every run, so each restores the shared
          # cache for this leg from main.
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          # Same packages and image as the quality job, so it restores that cache.
          cache-key: build-deps-ubuntu-22.04-x64
          packages: |
            build-essential
            curl
            file
            libayatana-appindicator3-dev
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            patchelf
            pkg-config
            wget
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: platform-${{ matrix.target }}-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile desktop application
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --profile dist
