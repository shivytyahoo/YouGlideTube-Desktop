[package]
name = "youglidetube"
version = "1.0.3"
description = "YouGlideTube Desktop — a YouTube and YouTube Music desktop client with Google sign-in and the YouGlideTube theme"
authors = ["shivyt"]
edition = "2024"
default-run = "youglidetube"
license = "GPL-3.0-only"
repository = "https://github.com/shivytyahoo/YouGlideTube-Desktop"

[lib]
name = "youglidetube_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
# Deep linking: the youglidetube:// scheme the browser extension hands off to.
tauri-plugin-deep-link = "2"
# In-app updates: signature-verified GitHub-releases updater + relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Core Async & Serialization
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

# Discord Rich Presence
discord-rich-presence = "1.1"

# Database & Data Types
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"

# Error Handling & Observability
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Persist logs to a rolling file in the app data dir so failures stay diagnosable
# after the fact (the packaged app has no attached terminal to read stdout from).
tracing-appender = "0.2"

# HTTP Client
reqwest = { version = "0.13.3", features = ["stream", "json", "form", "brotli", "gzip", "rustls", "socks"] }
# The system proxy lookup behind api/app_proxy.rs; reqwest already builds these.
hyper = "1"
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
webm-iterable = "0.7.1"

# Cover-art embedding for downloaded music/audio (MP4 covr, ID3 APIC, Vorbis pictures).
lofty = "0.25.4"
# Cropping and re-encoding download covers (decoders for what the image CDNs serve, JPEG out).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# SABR streaming protocol (self-contained protobuf/UMP codec, no external toolchain)
base64 = "0.23"

# NLP Pipeline: neuro key spec 2, Android parity. Snowball 3.1.1 stems (rust-stemmers
# predates it), NFKC folding, Java-style character classes and the ICU dictionary word breaker.
snowstem = "0.1"
unicode-normalization = "0.1"
icu_properties = "2"
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }

# Local Sync (P2P) — payload cryptography (FLOW-SYNC/1).
# AES-256-GCM payload encryption with HKDF-derived directional keys and an HMAC-SHA256 SAS.
hkdf = "0.13"
hmac = "0.13"
# SAPISIDHASH for Google sign-in (SHA-1 of "<unix-seconds> <SAPISID> <origin>").
sha1 = "0.10"
sha2 = "0.11"
rand = "0.10"
hex = "0.4"
# Scrobbling: Last.fm's api_sig is an MD5 digest, and session keys and tokens live in the OS
# keychain (macOS Keychain, Windows Credential Manager, the Secret Service on Linux).
md-5 = "0.11"
keyring = "4"

# Master backups: the same zip layout the Android app reads and writes.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# FLOW-SYNC/2 WebDAV stores: reading PROPFIND answers.
quick-xml = "0.42"
# Reading the segment index of fragmented MP4 audio, to serve it as HLS.
mp4-atom = { version = "0.17", default-features = false }
deunicode = "1.6.2"
trash = "5"
encoding_rs = "0.8"

# Native Windows toast notifications: build the toast XML directly so we can attach
# the app logo + a video thumbnail (hero image) and register a proper AppUserModelID,
# so the system attributes notifications to "YouGlideTube" instead of PowerShell.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.100"
# Core Audio and the process snapshot name YouGlideTube's WebView2 audio in the volume mixer.
windows = { version = "0.62", features = [
  "Foundation",
  "Globalization",
  "Media_SpeechRecognition",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
] }
windows-core = "0.62"
# WinRT async operations (IAsyncOperation/AsyncStatus) live in this crate
# since windows 0.58; voice search polls the recognition operation through it.
windows-future = "0.3"

# Single-instance: forward a second `youglidetube://` launch to the running window
# instead of spawning a duplicate. The "deep-link" feature makes it hand the
# argv URL to the deep-link plugin's on_open_url automatically.
# The version wry uses, for WebKit preferences wry does not expose (src/macos_window.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# statfs, to tell a read-only app location (a disk image, a translocated copy) from Applications.
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
# Global media keys. Installed at runtime only once the setting is turned on (services/media_keys.rs).
tauri-plugin-global-shortcut = "2"

# tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption` with only the fields rust-ini 0.21.1
# has, so 0.21.3 breaks its Linux build. Drop this pin once deep-link ships a fix.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.3"
# The version wry uses, for the web-process-terminated signal (src/web_process.rs).
webkit2gtk = { version = "=2.0.2", features = ["v2_20"] }
# Probes for the AppIndicator library before building the tray (src/services/music_tray.rs).
libloading = "0.9"

[profile.release]
# Keep production binaries compact without sacrificing the normal release optimizer.
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"

# PR builds: thin LTO keeps most of the speed of the release
# profile at a fraction of the link time. Tagged releases still use [profile.release].
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16


[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
# In-process WebDAV server for the FLOW-SYNC/2 WebDAV store tests.
dav-server = { version = "0.12", default-features = false, features = ["memfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
